client_id = "54f8e6b854023de59d44cf6c2b6afe5b"
name = "Shoelaces App"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_publications,write_metaobject_definitions,write_metaobjects,write_products,write_publications"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
api_version = "2026-07"

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "/api/uploadPDF"
subpath = "shoelaces-upload-pdf"
prefix = "apps"
